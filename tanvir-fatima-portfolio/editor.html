<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site Editor</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a2c47;--navy9:#071c2e;--gold:#c9a24a;--gold4:#d9bd77;--gold6:#a9812f;--ivory:#faf9f6;--ivory2:#f3f1ea;--ink:#1a2027;--ink7:#3c4650;--ink5:#64707b;--border:#e1dcce;--field:#d6d0c1;--red:#b3261e;--green:#2f7d4f;
--serif:"Playfair Display",Georgia,serif;--sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:90px}
body{margin:0;font-family:var(--sans);background:var(--ivory);color:var(--ink);font-size:15px;line-height:1.5}
a{color:var(--navy)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:12px 20px;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.brand strong{font-family:var(--serif);font-size:1.2rem}
.brand span{color:var(--gold4);font-size:.9rem}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:8px;padding:8px 14px;border:1px solid transparent;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--gold);color:var(--navy9)}
.btn.primary:hover:not(:disabled){background:var(--gold4)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--border)}
.btn.ghost:hover:not(:disabled){background:var(--ivory2)}
.top .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.top .btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.1)}
.btn.small{padding:5px 10px;font-size:.8rem}
.btn.icon{padding:5px 8px;font-size:.85rem}
.btn.danger{background:#fff;color:var(--red);border-color:#e8c4c1}
.btn.danger.armed,.top .btn.danger.armed{background:var(--red);color:#fff;border-color:var(--red)}
.top .btn.danger{background:transparent;color:#f3c6c2;border-color:rgba(243,198,194,.45)}
.pill{font-size:.8rem;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.pill.ok{background:var(--green)}
.pill.busy{background:var(--gold6)}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:28px;padding:26px 20px 90px}
.tabs{position:sticky;top:86px;align-self:start;display:flex;flex-direction:column;gap:2px}
.tab{font:inherit;border:0;background:none;text-align:left;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--ink7);font-weight:600;font-size:.92rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tab:hover{background:var(--ivory2)}
.tab[aria-current="page"]{background:var(--navy);color:#fff}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tab.sep{margin-top:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}
.panel h1{font-family:var(--serif);font-size:1.75rem;margin:0 0 4px;color:var(--navy);line-height:1.25}
.lead{color:var(--ink5);margin:0 0 22px}
.group{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.group>h2{font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--gold6);margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.field{display:flex;flex-direction:column;gap:5px;grid-column:1/-1;min-width:0}
.field.half{grid-column:auto}
.flabel{font-weight:600;font-size:.86rem;color:var(--ink7)}
.hint{font-size:.8rem;color:var(--ink5)}
input[type=text],input[type=url],input[type=email],input[type=number],input[type=password],input[type=search],select,textarea{font:inherit;font-size:.95rem;padding:9px 11px;border:1px solid var(--field);border-radius:8px;background:#fff;color:var(--ink);width:100%}
input[type=file]{font:inherit;font-size:.9rem;max-width:100%}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.field.check{flex-direction:row;align-items:center;gap:9px;padding-top:24px}
.field.check input{width:18px;height:18px;margin:0;accent-color:var(--navy)}
.field.check .flabel{font-weight:600}
.list-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.list-bar input[type=search]{flex:1 1 220px;width:auto}
.list-bar select{width:auto}
.count{color:var(--ink5);font-size:.85rem;margin-left:auto}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.card[open]{border-color:#cfc6af;box-shadow:0 4px 16px rgba(10,44,71,.06)}
.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px;border-radius:12px}
.card>summary::-webkit-details-marker{display:none}
.card>summary:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.chev{display:inline-block;color:var(--ink5);transition:transform .15s;flex:none;font-size:.75rem;line-height:1}
.card[open] .chev{transform:rotate(90deg)}
.card-title{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-title.empty{color:var(--ink5);font-style:italic;font-weight:400}
.card-meta{color:var(--ink5);font-size:.82rem;white-space:nowrap}
.card-ctrl{display:flex;gap:4px;flex:none}
.card-body{padding:2px 16px 18px;border-top:1px solid var(--ivory2)}
.card-body .grid{margin-top:14px}
.warn{background:#fdf6e3;border:1px solid #ecd9a3;color:#5e4810;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}
.warn:empty{display:none}
.note{background:var(--ivory2);border-radius:10px;padding:12px 14px;font-size:.9rem;color:var(--ink7)}
.steps{margin:0 0 16px;padding-left:20px}
.steps li{margin-bottom:7px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photo-prev{width:170px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:var(--navy);display:block}
.pending{display:inline-block;background:#fdf6e3;color:#5e4810;border:1px solid #ecd9a3;border-radius:999px;font-size:.78rem;padding:2px 9px;font-weight:600}
.empty-list{color:var(--ink5);font-style:italic;padding:8px 2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--navy9);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.25);max-width:min(600px,calc(100% - 32px));opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;font-size:.93rem}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast.error{background:var(--red)}
.toast a{color:var(--gold4);font-weight:600}
.modal-back{position:fixed;inset:0;background:rgba(7,28,46,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:14px;max-width:540px;width:100%;padding:22px 22px 18px;box-shadow:0 24px 60px rgba(0,0,0,.3);max-height:calc(100vh - 32px);overflow:auto}
.modal h2{font-family:var(--serif);color:var(--navy);margin:0 0 8px;font-size:1.4rem}
.modal ul{padding-left:18px;margin:6px 0 16px;color:var(--ink7);font-size:.92rem}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
code{background:var(--ivory2);padding:1px 5px;border-radius:4px;font-size:.88em}
details.adv>summary{cursor:pointer;font-weight:600;color:var(--navy)}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;padding:14px 16px 90px;gap:14px}
  .tabs{position:sticky;top:0;flex-direction:row;overflow-x:auto;gap:4px;padding:8px 0;background:var(--ivory);z-index:10;margin:0 -16px;padding-left:16px;padding-right:16px}
  .top{position:static}
  .tab{white-space:nowrap}
  .tab.sep{margin-top:0}
  .grid{grid-template-columns:1fr}
  .field.half{grid-column:1/-1}
  .field.check{padding-top:0}
  .card-meta{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><strong>Site Editor</strong><span id="siteName"></span></div>
  <div class="top-actions">
    <span id="conn" class="pill">Not connected</span>
    <a class="btn ghost" href="./" target="_blank" rel="noopener">View site ↗</a>
    <button class="btn danger" id="btnDiscard" type="button" hidden>Discard</button>
    <button class="btn ghost" id="btnDownload" type="button" disabled>Download files</button>
    <button class="btn primary" id="btnPublish" type="button" disabled>Publish</button>
  </div>
</header>
<div class="layout">
  <nav id="tabs" class="tabs" aria-label="Sections"></nav>
  <main id="panel" class="panel" tabindex="-1"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="data/profile.js"></script>
<script src="data/education.js"></script>
<script src="data/experience.js"></script>
<script src="data/research.js"></script>
<script src="data/publications.js"></script>
<script src="data/projects.js"></script>
<script src="data/awards.js"></script>
<script src="data/certifications.js"></script>
<script src="data/skills.js"></script>
<script>
/*
 * Site editor for the academic portfolio.
 * Reads the content in data/*.js, lets you edit it in forms, and publishes the
 * changes to GitHub as a single commit (which redeploys the live site).
 * The GitHub token is stored only in this browser and sent only to api.github.com.
 */
(function () {
  'use strict';

  /* ---------------- helpers ---------------- */
  function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function store(kind) {
    function s() { try { return window[kind]; } catch (e) { return null; } }
    return {
      get: function (k) { try { return s().getItem(k); } catch (e) { return null; } },
      set: function (k, v) { try { s().setItem(k, v); } catch (e) {} },
      del: function (k) { try { s().removeItem(k); } catch (e) {} }
    };
  }
  var LS = store('localStorage'), SS = store('sessionStorage');
  function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function getPath(o, p) { return p.split('.').reduce(function (a, k) { return a == null ? undefined : a[k]; }, o); }
  function setPath(o, p, v) {
    var ks = p.split('.'), last = ks.pop();
    var t = ks.reduce(function (a, k) { if (a[k] == null || typeof a[k] !== 'object') a[k] = {}; return a[k]; }, o);
    t[last] = v;
  }
  function trim(s) { return s.trim(); }
  function b64FromBytes(bytes) { var bin = '', CH = 0x8000; for (var i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH)); return btoa(bin); }
  function b64FromText(s) { return b64FromBytes(new TextEncoder().encode(s)); }
  function bytesFromB64(b) { var bin = atob(b.replace(/\s/g, '')); var u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function textFromB64(b) { return new TextDecoder().decode(bytesFromB64(b)); }

  /* ---------------- configuration ---------------- */
  var DEFAULTS = { owner: 'altafhussain-ah', repo: 'tanvir-fatima-portfolio', branch: 'main', base: 'tanvir-fatima-portfolio/', liveUrl: 'https://dr-tanvir-fatima.vercel.app/' };
  var cfg = Object.assign({}, DEFAULTS);
  try { Object.assign(cfg, JSON.parse(LS.get('siteEditor.cfg') || '{}')); } catch (e) {}
  var token = SS.get('siteEditor.token') || LS.get('siteEditor.token') || '';
  var CV_PATH = 'assets/cv/Dr-Tanvir-Fatima-Naik-Bukht-CV.pdf';

  var FILES = [
    { key: 'profile', path: 'data/profile.js', vars: ['PROFILE'] },
    { key: 'education', path: 'data/education.js', vars: ['EDUCATION'] },
    { key: 'experience', path: 'data/experience.js', vars: ['EXPERIENCE'] },
    { key: 'research', path: 'data/research.js', vars: ['RESEARCH_AREAS'] },
    { key: 'publications', path: 'data/publications.js', vars: ['PUBLICATIONS', 'PUBLICATION_STATS'] },
    { key: 'projects', path: 'data/projects.js', vars: ['PROJECTS'] },
    { key: 'awards', path: 'data/awards.js', vars: ['AWARDS'] },
    { key: 'certifications', path: 'data/certifications.js', vars: ['CERTIFICATIONS'] },
    { key: 'skills', path: 'data/skills.js', vars: ['SKILLS'] }
  ];
  var EMPTY = { PROFILE: {}, EDUCATION: [], EXPERIENCE: [], RESEARCH_AREAS: [], PUBLICATIONS: [], PUBLICATION_STATS: {}, PROJECTS: [], AWARDS: [], CERTIFICATIONS: [], SKILLS: { research: [], technical: [], teaching: [], professional: [] } };

  /* Content as deployed with this page (used until GitHub is connected). */
  var deployed = {
    PROFILE: typeof PROFILE !== 'undefined' ? PROFILE : undefined,
    EDUCATION: typeof EDUCATION !== 'undefined' ? EDUCATION : undefined,
    EXPERIENCE: typeof EXPERIENCE !== 'undefined' ? EXPERIENCE : undefined,
    RESEARCH_AREAS: typeof RESEARCH_AREAS !== 'undefined' ? RESEARCH_AREAS : undefined,
    PUBLICATIONS: typeof PUBLICATIONS !== 'undefined' ? PUBLICATIONS : undefined,
    PUBLICATION_STATS: typeof PUBLICATION_STATS !== 'undefined' ? PUBLICATION_STATS : undefined,
    PROJECTS: typeof PROJECTS !== 'undefined' ? PROJECTS : undefined,
    AWARDS: typeof AWARDS !== 'undefined' ? AWARDS : undefined,
    CERTIFICATIONS: typeof CERTIFICATIONS !== 'undefined' ? CERTIFICATIONS : undefined,
    SKILLS: typeof SKILLS !== 'undefined' ? SKILLS : undefined
  };
  var data = {};
  function adopt(src, vars) { vars.forEach(function (v) { data[v] = src[v] !== undefined ? clone(src[v]) : clone(EMPTY[v]); }); }
  adopt(deployed, Object.keys(EMPTY));

  function serialize(f, src) {
    src = src || data;
    var out = '/**\n * ' + f.path.split('/').pop() + ' — website content.\n' +
      ' * Managed with the site editor (editor.html). Editing by hand is fine too:\n' +
      ' * keep each "const NAME = ...;" line and the quotes, commas and brackets intact.\n */\n';
    f.vars.forEach(function (v) { out += '\nconst ' + v + ' = ' + JSON.stringify(src[v], null, 2) + ';\n'; });
    return out;
  }
  function parseFile(src, vars) {
    var body = src + '\n;return {' + vars.map(function (v) {
      return JSON.stringify(v) + ': (typeof ' + v + ' !== "undefined" ? ' + v + ' : undefined)';
    }).join(', ') + '};';
    return new Function(body)();
  }

  var original = {};
  function snapshot(f) { original[f.key] = serialize(f); }
  FILES.forEach(snapshot);
  var remoteSha = {};     // data file path -> blob sha on GitHub when loaded
  var assets = {};        // repo-relative path -> {kind, b64, url, label, restore}
  var connected = false;

  function changedFiles() { return FILES.filter(function (f) { return serialize(f) !== original[f.key]; }); }
  function changeCount() { return changedFiles().length + Object.keys(assets).length; }

  /* ---------------- UI chrome ---------------- */
  var tabsEl = document.getElementById('tabs');
  var panel = document.getElementById('panel');
  var btnPublish = document.getElementById('btnPublish');
  var btnDownload = document.getElementById('btnDownload');
  var btnDiscard = document.getElementById('btnDiscard');
  var connEl = document.getElementById('conn');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg, kind, link) {
    toastEl.textContent = msg;
    if (link) { toastEl.appendChild(document.createTextNode(' ')); var a = h('a', null, link.text); a.href = link.href; a.target = '_blank'; a.rel = 'noopener'; toastEl.appendChild(a); }
    toastEl.className = 'toast show' + (kind === 'error' ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, kind === 'error' ? 9000 : 6000);
  }
  function setConn(text, cls) { connEl.textContent = text; connEl.className = 'pill' + (cls ? ' ' + cls : ''); }

  function armButton(btn, armedText, action) {
    var normal = btn.textContent, timer = null;
    btn.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      if (btn.classList.contains('armed')) { clearTimeout(timer); btn.classList.remove('armed'); btn.textContent = normal; action(); return; }
      btn.classList.add('armed'); btn.textContent = armedText;
      timer = setTimeout(function () { btn.classList.remove('armed'); btn.textContent = normal; }, 3500);
    });
  }

  var TABS = [
    { id: 'profile', label: 'Profile', files: ['profile'] },
    { id: 'contact', label: 'Contact & links', files: ['profile'] },
    { id: 'education', label: 'Education', files: ['education'] },
    { id: 'experience', label: 'Experience', files: ['experience'] },
    { id: 'research', label: 'Research areas', files: ['research'] },
    { id: 'publications', label: 'Publications', files: ['publications'] },
    { id: 'projects', label: 'Projects', files: ['projects'] },
    { id: 'awards', label: 'Awards', files: ['awards'] },
    { id: 'certifications', label: 'Certifications', files: ['certifications'] },
    { id: 'skills', label: 'Skills', files: ['skills'] },
    { id: 'files', label: 'Photo & CV', files: [], assets: true },
    { id: 'publish', label: 'Publishing setup', files: [], sep: true }
  ];
  var current = (location.hash || '').slice(1);
  if (!TABS.some(function (t) { return t.id === current; })) current = 'profile';
  var validators = [];

  function drawTabs() {
    var changed = changedFiles().map(function (f) { return f.key; });
    tabsEl.innerHTML = '';
    TABS.forEach(function (t) {
      var b = h('button', 'tab' + (t.sep ? ' sep' : ''));
      b.type = 'button';
      if (t.id === current) b.setAttribute('aria-current', 'page');
      b.appendChild(h('span', null, t.label));
      var dirty = t.files.some(function (k) { return changed.indexOf(k) >= 0; }) || (t.assets && Object.keys(assets).length > 0);
      if (dirty) { var d = h('span', 'dot'); d.title = 'Unpublished changes'; d.setAttribute('aria-label', 'unpublished changes'); b.appendChild(d); }
      if (t.id === 'publish' && !connected) { var d2 = h('span', 'dot'); d2.style.background = '#b8b0a0'; d2.title = 'Not connected'; b.appendChild(d2); }
      b.addEventListener('click', function () { show(t.id); });
      tabsEl.appendChild(b);
    });
  }
  function runValidators() { validators.forEach(function (v) { v(); }); }
  function refreshChrome() {
    var n = changeCount();
    btnPublish.textContent = n ? 'Publish ' + n + (n === 1 ? ' change' : ' changes') : 'Publish';
    btnPublish.disabled = !n;
    btnDownload.disabled = !n;
    btnDiscard.hidden = !n;
    document.getElementById('siteName').textContent = (data.PROFILE && data.PROFILE.fullName) || '';
    drawTabs();
    runValidators();
  }
  function show(id, keepScroll) {
    current = id;
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    validators = [];
    panel.innerHTML = '';
    RENDER[id]();
    refreshChrome();
    if (!keepScroll) window.scrollTo(0, 0);
  }

  /* ---------------- form building blocks ---------------- */
  function head(title, lead) { panel.appendChild(h('h1', null, title)); if (lead) panel.appendChild(h('p', 'lead', lead)); }
  function group(title, parent) {
    var g = h('section', 'group');
    if (title) g.appendChild(h('h2', null, title));
    var grid = h('div', 'grid'); g.appendChild(grid);
    (parent || panel).appendChild(g);
    return grid;
  }
  function warnBox(fn) {
    var w = h('div', 'warn'); w.setAttribute('role', 'status');
    panel.appendChild(w);
    validators.push(function () {
      var msgs = fn(); w.textContent = '';
      msgs.forEach(function (m, i) { if (i) w.appendChild(h('br')); w.appendChild(document.createTextNode('⚠︎  ' + m)); });
    });
    return w;
  }
  var uid = 0;
  function field(obj, spec, onChange) {
    var t = spec.t || 'text';
    var wrap = h('div', 'field' + (spec.w === 'half' ? ' half' : '') + (t === 'bool' ? ' check' : ''));
    var id = 'f' + (++uid);
    var lab = h('label', 'flabel', spec.l); lab.htmlFor = id;
    var val = getPath(obj, spec.k), input;
    switch (t) {
      case 'textarea': input = h('textarea'); input.rows = spec.r || 4; input.value = val == null ? '' : String(val); break;
      case 'lines': input = h('textarea'); input.rows = spec.r || 4; input.value = (val || []).join('\n'); break;
      case 'paras': input = h('textarea'); input.rows = spec.r || 10; input.value = (val || []).join('\n\n'); break;
      case 'csv': input = h('input'); input.type = 'text'; input.value = (val || []).join(', '); break;
      case 'number': input = h('input'); input.type = 'number'; input.value = val == null ? '' : val; break;
      case 'bool': input = h('input'); input.type = 'checkbox'; input.checked = !!val; break;
      case 'select':
        input = h('select');
        spec.o.forEach(function (o) { var op = h('option', null, Array.isArray(o) ? o[1] : o); op.value = Array.isArray(o) ? o[0] : o; input.appendChild(op); });
        input.value = val == null ? (Array.isArray(spec.o[0]) ? spec.o[0][0] : spec.o[0]) : val;
        break;
      default: input = h('input'); input.type = (t === 'url' || t === 'email') ? t : 'text'; input.value = val == null ? '' : String(val);
    }
    input.id = id;
    if (t === 'url' || t === 'email') input.spellcheck = false;
    input.addEventListener((t === 'bool' || t === 'select') ? 'change' : 'input', function () {
      var v;

        rr.appendChild(reload); rr.appendChild(disc); r.appendChild(rr); sg.appendChild(r);
      }

      var tg = group(connected ? 'Change token' : 'Connect with a GitHub access token');
      var steps = h('div', 'field');
      var ol = h('ol', 'steps');
      [
        ['Open ', { a: 'GitHub → new fine-grained token', href: 'https://github.com/settings/personal-access-tokens/new' }, ' while signed in as ' + cfg.owner + '.'],
        ['Token name: “Website editor”. Expiration: pick how long it should work (up to a year).'],
        ['Repository access: choose “Only select repositories” and select ' + cfg.owner + '/' + cfg.repo + '.'],
        ['Permissions → Repository permissions → Contents: set to “Read and write”. Leave everything else unchanged.'],
        ['Click “Generate token”, copy it, and paste it below.']
      ].forEach(function (parts) {
        var li = h('li');
        parts.forEach(function (p) { if (typeof p === 'string') li.appendChild(document.createTextNode(p)); else { var a = h('a', null, p.a); a.href = p.href; a.target = '_blank'; a.rel = 'noopener'; li.appendChild(a); } });
        ol.appendChild(li);
      });
      steps.appendChild(ol); tg.appendChild(steps);

      var tf = h('div', 'field');
      var tl = h('label', 'flabel', 'Access token'); tl.htmlFor = 'tokIn';
      var tin = h('input'); tin.type = 'password'; tin.id = 'tokIn'; tin.autocomplete = 'off'; tin.spellcheck = false; tin.placeholder = 'github_pat_…';
      tf.appendChild(tl); tf.appendChild(tin); tg.appendChild(tf);
      var rf = h('div', 'field check');
      var rem = h('input'); rem.type = 'checkbox'; rem.id = 'remIn'; rem.checked = !!LS.get('siteEditor.token') || !token;
      var reml = h('label', 'flabel', 'Remember on this device'); reml.htmlFor = 'remIn';
      rf.style.paddingTop = '0'; rf.appendChild(rem); rf.appendChild(reml); tg.appendChild(rf);
      var bf = h('div', 'field');
      var go = h('button', 'btn primary', 'Connect'); go.type = 'button'; go.style.alignSelf = 'flex-start';
      go.addEventListener('click', function () {
        var v = tin.value.trim();
        if (!v) { toast('Paste the token first.', 'error'); tin.focus(); return; }
        token = v; tin.value = '';
        if (rem.checked) { LS.set('siteEditor.token', v); SS.del('siteEditor.token'); } else { SS.set('siteEditor.token', v); LS.del('siteEditor.token'); }
        connect(false);
      });
      tin.addEventListener('keydown', function (e) { if (e.key === 'Enter') go.click(); });
      bf.appendChild(go); tg.appendChild(bf);
      tg.appendChild(h('div', 'note field', 'The token stays in this browser only and is sent only to GitHub (api.github.com). Anyone who has it can change the website, so don’t share it. Untick “Remember” on a shared computer. You can revoke it any time on GitHub under Settings → Developer settings → Personal access tokens.'));

      var ag = group('Good to know');
      ag.appendChild(h('div', 'note field', 'This editor changes the content: text, lists, links, photo and CV. The design, layout, colours and the fixed section headings stay as they are. After you publish, the site at ' + cfg.liveUrl + ' updates in about a minute. A copy of every published version is kept in the GitHub history, so any change can be rolled back.'));
      var adv = h('details', 'adv field');
      adv.appendChild(h('summary', null, 'Advanced: repository settings'));
      var ad = h('div', 'grid'); ad.style.marginTop = '12px';
      var tmp = Object.assign({}, cfg);
      addFields(ad, tmp, [
        { k: 'owner', l: 'GitHub account', w: 'half' }, { k: 'repo', l: 'Repository', w: 'half' },
        { k: 'branch', l: 'Branch', w: 'half' }, { k: 'base', l: 'Site folder in the repository', w: 'half', h: 'Ends with “/”. Empty if the site is at the top level.' },
        { k: 'liveUrl', l: 'Live site address', t: 'url' }
      ]);
      var sv = h('button', 'btn ghost small', 'Save settings'); sv.type = 'button';
      sv.addEventListener('click', function () {
        if (tmp.base && tmp.base.slice(-1) !== '/') tmp.base += '/';
        cfg = tmp; LS.set('siteEditor.cfg', JSON.stringify(cfg)); toast('Settings saved.');
        if (token) connect(false);
      });
      var svw = h('div', 'field'); svw.appendChild(sv); ad.appendChild(svw);
      adv.appendChild(ad); ag.appendChild(adv);
    }
  };

  function readFile(file, cb) {
    var r = new FileReader();
    r.onload = function () { cb(b64FromBytes(new Uint8Array(r.result))); };
    r.onerror = function () { toast('Could not read that file.', 'error'); };
    r.readAsArrayBuffer(file);
  }

  /* ---------------- GitHub ---------------- */
  function repoPath() { return '/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo); }
  function contentsPath(p) { return repoPath() + '/contents/' + p.split('/').map(encodeURIComponent).join('/') + '?ref=' + encodeURIComponent(cfg.branch); }
  function gh(method, path, body) {
    var headers = { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (body) headers['Content-Type'] = 'application/json';
    return fetch('https://api.github.com' + path, { method: method, headers: headers, cache: 'no-store', body: body ? JSON.stringify(body) : undefined })
      .then(function (res) {
        return res.text().then(function (txt) {
          var json = null; try { json = txt ? JSON.parse(txt) : null; } catch (e) {}
          if (!res.ok) { var err = new Error((json && json.message) || ('HTTP ' + res.status)); err.status = res.status; throw err; }
          return json;
        });
      });
  }
  function errMsg(e) {
    if (e && e.conflict) return e.message;
    if (e && e.status === 401) return 'GitHub did not accept the token. It may be mistyped, expired or revoked. Create a new one in Publishing setup.';
    if (e && e.status === 403) return 'The token isn’t allowed to change this repository. Check that “Contents” is set to “Read and write”. (' + e.message + ')';
    if (e && e.status === 404) return 'Repository or file not found. Make sure the token has access to ' + cfg.owner + '/' + cfg.repo + ', and check Publishing setup → Advanced.';
    if (e && e.status === 422 && /fast.?forward/i.test(e.message)) return 'Someone else changed the site on GitHub while you were publishing. Nothing was changed. Please try again.';
    if (e && e.name === 'TypeError') return 'Could not reach GitHub. Check the internet connection and try again.';
    return 'Something went wrong: ' + ((e && e.message) || e);
  }

  var connecting = false;
  function connect(silent) {
    if (!token || connecting) return Promise.resolve();
    connecting = true;
    setConn('Connecting…', 'busy');
    var drifted = [];
    return gh('GET', repoPath())
      .then(function (repo) {
        if (repo && repo.permissions && repo.permissions.push === false) { var e = new Error('no push'); e.status = 403; throw e; }
        return FILES.reduce(function (p, f) {
          return p.then(function () {
            return gh('GET', contentsPath(cfg.base + f.path)).then(function (res) {
              var parsed = parseFile(textFromB64(res.content || ''), f.vars);
              remoteSha[f.path] = res.sha;
              var dirty = serialize(f) !== original[f.key];
              if (!dirty) { adopt(parsed, f.vars); snapshot(f); }
              else {
                var remote = {}; f.vars.forEach(function (v) { remote[v] = parsed[v] !== undefined ? parsed[v] : EMPTY[v]; });
                if (serialize(f, remote) !== original[f.key]) drifted.push(f.path);
              }
            });
          });
        }, Promise.resolve());
      })
      .then(function () {
        connected = true; connecting = false;
        setConn('Connected', 'ok');
        show(current, true);
        if (drifted.length) toast('Heads up: ' + drifted.join(', ') + ' changed on GitHub since this page loaded. Publishing your edits to ' + (drifted.length > 1 ? 'those files' : 'that file') + ' would overwrite the newer version. Consider discarding and reloading.', 'error');
        else if (!silent) toast('Connected to GitHub. Content loaded from the latest version.');
      })
      .catch(function (e) {
        connected = false; connecting = false;
        setConn('Not connected');
        drawTabs();
        toast(errMsg(e), 'error');
      });
  }

  function publish(message) {
    var files = changedFiles();
    var list = files.map(function (f) { return { rel: f.path, path: cfg.base + f.path, b64: b64FromText(serialize(f)), file: f }; });
    Object.keys(assets).forEach(function (p) { list.push({ rel: p, path: cfg.base + p, b64: assets[p].b64 }); });
    var head, tree;
    // 1. make sure nobody changed these data files on GitHub since we loaded them
    return files.reduce(function (p, f) {
      return p.then(function () {
        return gh('GET', contentsPath(cfg.base + f.path)).then(function (res) {
          if (remoteSha[f.path] && res.sha !== remoteSha[f.path]) {
            var e = new Error(f.path + ' was changed on GitHub after you opened the editor, so publishing would overwrite that newer version. Nothing was published. Copy anything you need, click “Discard”, then reload this page to start from the latest content.');
            e.conflict = true; throw e;
          }
        }, function (e) { if (e.status === 404) return; throw e; });
      });
    }, Promise.resolve())
      // 2. current head of the branch
      .then(function () { return gh('GET', repoPath() + '/git/ref/heads/' + encodeURIComponent(cfg.branch)); })
      .then(function (ref) { head = ref.object.sha; return gh('GET', repoPath() + '/git/commits/' + head); })
      .then(function (commit) {
        tree = [];
        // 3. upload each file as a blob
        return list.reduce(function (p, item) {
          return p.then(function () {
            return gh('POST', repoPath() + '/git/blobs', { content: item.b64, encoding: 'base64' }).then(function (blob) {
              item.sha = blob.sha;
              tree.push({ path: item.path, mode: '100644', type: 'blob', sha: blob.sha });
            });
          });
        }, Promise.resolve()).then(function () { return commit.tree.sha; });
      })
      // 4. one tree + one commit for everything, then move the branch
      .then(function (baseTree) { return gh('POST', repoPath() + '/git/trees', { base_tree: baseTree, tree: tree }); })
      .then(function (t) { return gh('POST', repoPath() + '/git/commits', { message: message, tree: t.sha, parents: [head] }); })
      .then(function (c) {
        return gh('PATCH', repoPath() + '/git/refs/heads/' + encodeURIComponent(cfg.branch), { sha: c.sha }).then(function () { return c; });
      })
      .then(function (c) {
        list.forEach(function (item) { if (item.file) { remoteSha[item.rel] = item.sha; snapshot(item.file); } });
        assets = {};
        return c;
      });
  }

  function openPublish() {
    if (!changeCount()) return;
    if (!connected) { show('publish'); toast('Connect to GitHub first. It only takes a minute, and you only do it once.'); return; }
    var back = h('div', 'modal-back');
    var m = h('div', 'modal'); m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'pubT');
    var t = h('h2', null, 'Publish changes'); t.id = 'pubT'; m.appendChild(t);
    m.appendChild(h('p', null, 'These files will be updated, and the live site refreshes about a minute later:'));
    var ul = h('ul');
    changedFiles().forEach(function (f) { ul.appendChild(h('li', null, f.path)); });
    Object.keys(assets).forEach(function (p) { ul.appendChild(h('li', null, p + ' (' + assets[p].label + ')')); });
    m.appendChild(ul);
    var fl = h('div', 'field');
    var ml = h('label', 'flabel', 'What did you change? (optional)'); ml.htmlFor = 'msgIn';
    var msg = h('input'); msg.type = 'text'; msg.id = 'msgIn'; msg.placeholder = 'e.g. Added new journal paper';
    fl.appendChild(ml); fl.appendChild(msg);
    fl.appendChild(h('span', 'hint', 'Saved in the GitHub history so you can find this version later.'));
    m.appendChild(fl);
    var acts = h('div', 'modal-actions');
    var cancel = h('button', 'btn ghost', 'Cancel'); cancel.type = 'button';
    var go = h('button', 'btn primary', 'Publish now'); go.type = 'button';
    acts.appendChild(cancel); acts.appendChild(go); m.appendChild(acts);
    back.appendChild(m); document.body.appendChild(back);
    msg.focus();
    function close() { document.removeEventListener('keydown', onKey); back.remove(); btnPublish.focus(); }
    function onKey(e) { if (e.key === 'Escape' && !go.disabled) close(); }
    document.addEventListener('keydown', onKey);
    back.addEventListener('click', function (e) { if (e.target === back && !go.disabled) close(); });
    cancel.addEventListener('click', close);
    msg.addEventListener('keydown', function (e) { if (e.key === 'Enter') go.click(); });
    go.addEventListener('click', function () {
      go.disabled = true; cancel.disabled = true; go.textContent = 'Publishing…';
      setConn('Publishing…', 'busy');
      publish(msg.value.trim() || 'Update website content (site editor)').then(function () {
        close(); setConn('Connected', 'ok');
        show(current, true);
        toast('Published. The live site updates in about a minute:', null, { text: cfg.liveUrl.replace(/^https?:\/\//, ''), href: cfg.liveUrl });
      }).catch(function (e) {
        go.disabled = false; cancel.disabled = false; go.textContent = 'Publish now';
        setConn('Connected', 'ok');
        toast(errMsg(e), 'error');
      });
    });
  }

  function saveBlob(blob, name) {
    var a = h('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  function download() {
    changedFiles().forEach(function (f) { saveBlob(new Blob([serialize(f)], { type: 'text/javascript' }), f.path.split('/').pop()); });
    Object.keys(assets).forEach(function (p) { saveBlob(new Blob([bytesFromB64(assets[p].b64)]), p.split('/').pop()); });
    toast('Downloaded. Upload the .js files into the data folder on GitHub, and any photo or CV into its assets folder.');
  }
  function discardAll() {
    FILES.forEach(function (f) { adopt(parseFile(original[f.key], f.vars), f.vars); });
    assets = {};
    show(current, true);
    toast('All unpublished changes were discarded.');
  }

  btnPublish.addEventListener('click', openPublish);
  btnDownload.addEventListener('click', download);
  armButton(btnDiscard, 'Confirm discard', discardAll);
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); openPublish(); }
  });
  window.addEventListener('beforeunload', function (e) { if (changeCount()) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('hashchange', function () { var id = location.hash.slice(1); if (id !== current && RENDER[id]) show(id); });

  window.SiteEditor = {
    data: data,
    changedFiles: function () { return changedFiles().map(function (f) { return f.path; }); },
    serialize: function (key) { return serialize(FILES.filter(function (f) { return f.key === key; })[0]); }
  };

  show(current);
  if (token) connect(true);
})();
</script>
</body>
</html>
